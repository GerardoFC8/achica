name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the single source of truth: Cloudflare Pages reads the same
      # file, so CI and the host cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser Vitest project runs the codec tests in real Chromium,
      # because @jsquash decodes to ImageData and Node has no ImageData.
      - name: Install Chromium for the browser test project
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
