name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the single source of truth: Cloudflare Pages reads the same
      # file, so CI and the host cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium runs the codec tests, because @jsquash decodes to ImageData
      # and Node has no ImageData. Firefox runs the output tests: it has no
      # File System Access API, so it is the browser where the ZIP fallback is
      # the only road out and the one place that path is really proven.
      - name: Install the browsers the test projects need
        run: npx playwright install --with-deps chromium firefox

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # The product, against the build that ships, in both browsers it targets.
      # It is the only place the central promise is really checked: Playwright
      # sees every request the page makes, which is what "no byte leaves your
      # device" always needed and Resource Timing could never give.
      - name: Smoke test the production build
        run: npm run smoke
