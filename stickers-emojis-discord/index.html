<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stickers y emojis animados de Discord desde un GIF, APNG, WebP o video | achica</title>
    <meta
      name="description"
      content="Arrastra un GIF, un APNG, un WebP animado o un video (MP4 o WebM, si tu navegador puede reproducirlo) y sale un sticker o un emoji animado ajustado al peso que Discord publica, en tu navegador y sin subir nada. Cuando no cabe, te lo dice. Sin cuentas, gratis y de código abierto."
    />
    <link rel="canonical" href="https://achica.gfcode.dev/stickers-emojis-discord/" />
    <link rel="alternate" hreflang="es" href="https://achica.gfcode.dev/stickers-emojis-discord/" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://achica.gfcode.dev/en/discord-stickers-emojis/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://achica.gfcode.dev/stickers-emojis-discord/"
    />
    <meta name="theme-color" content="#f2f1ec" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Read by the link previews of WhatsApp, X, LinkedIn and Slack, none of
      which run JavaScript. Absolute URLs because a crawler resolves nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="achica" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://achica.gfcode.dev/stickers-emojis-discord/" />
    <meta
      property="og:title"
      content="achica: stickers y emojis animados de Discord, sin subir nada"
    />
    <meta
      property="og:description"
      content="Un GIF, un APNG, un WebP animado o un video, ajustado al peso que Discord publica, en tu navegador. Ningún byte de tus archivos sale de tu dispositivo."
    />
    <meta property="og:image" content="https://achica.gfcode.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="achica, herramientas de imagen por lote: tres barras de peso sobre papel claro"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "achica: stickers y emojis animados de Discord",
        "url": "https://achica.gfcode.dev/stickers-emojis-discord/",
        "description": "Ajusta un GIF, un APNG, un WebP animado o un video (MP4 o WebM, si el navegador puede reproducirlo) al peso que Discord publica para un sticker o un emoji animado. Corre entero en el navegador, sin backend y sin cuentas.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Cualquiera con un navegador actual",
        "browserRequirements": "Requiere JavaScript y un navegador que sepa leer animaciones",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Convierte un GIF, un APNG, un WebP animado o un video en un sticker o un emoji animado",
          "Del video usa el tramo que elijas, hasta 15 s; se reproduce en la pestaña, que debe estar visible, y solo si tu navegador puede leerlo",
          "Ajusta el peso a los límites que Discord publica, bajando primero lo menos visible",
          "Dice cuándo no cabe, con el peso final y el límite",
          "Conviene probar el archivo en Discord: no se garantiza que lo acepte",
          "Descarga en ZIP o directo a una carpeta",
          "Ninguna imagen sale del dispositivo"
        ]
      }
    </script>
  </head>
  <body data-tool="discord">
    <!--
      Empty in the source. The build fills it with the first screen rendered
      ahead of time (scripts/prerender.mjs), so the page reads the same before
      and after the script runs, and to readers that never run it.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
