<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medir el ahorro de las imágenes de una web con un HAR, sin subirlo | achica</title>
    <meta
      name="description"
      content="Arrastra un archivo HAR de tu página y mide cuánto ahorrarías recomprimiendo sus imágenes con achica, en tu navegador y sin subir nada. JPEG, PNG, WebP y AVIF; lo que no se puede medir se lista con el motivo. Sin cuentas, gratis y de código abierto."
    />
    <link rel="canonical" href="https://achica.gfcode.dev/auditar-imagenes-web/" />
    <link rel="alternate" hreflang="es" href="https://achica.gfcode.dev/auditar-imagenes-web/" />
    <link rel="alternate" hreflang="en" href="https://achica.gfcode.dev/en/audit-web-images/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://achica.gfcode.dev/auditar-imagenes-web/"
    />
    <meta name="theme-color" content="#f2f1ec" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Read by the link previews of WhatsApp, X, LinkedIn and Slack, none of
      which run JavaScript. Absolute URLs because a crawler resolves nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="achica" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://achica.gfcode.dev/auditar-imagenes-web/" />
    <meta
      property="og:title"
      content="achica: mide cuánto ahorrarías en las imágenes de una página, sin subir nada"
    />
    <meta
      property="og:description"
      content="Arrastra un HAR de tu página: se lee en tu navegador y ningún byte sale de tu dispositivo. JPEG, PNG, WebP y AVIF."
    />
    <meta property="og:image" content="https://achica.gfcode.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="achica, herramientas de imagen por lote: tres barras de peso sobre papel claro"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "achica: auditar imágenes de una web",
        "url": "https://achica.gfcode.dev/auditar-imagenes-web/",
        "description": "Mide cuánto ahorrarías recomprimiendo las imágenes de un archivo HAR. Corre entero en el navegador, sin backend y sin cuentas.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Cualquiera con un navegador actual",
        "browserRequirements": "Requiere JavaScript y WebAssembly",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Lee un archivo HAR de tu página en tu navegador, sin subirlo",
          "Recomprime sus imágenes JPEG, PNG, WebP y AVIF y mide el ahorro",
          "Lista lo que no puede medir, con el motivo",
          "Descarga en ZIP o directo a una carpeta",
          "Ninguna imagen sale del dispositivo"
        ]
      }
    </script>
  </head>
  <body data-tool="auditar">
    <!--
      Empty in the source. The build fills it with the first screen rendered
      ahead of time (scripts/prerender.mjs), so the page reads the same before
      and after the script runs, and to readers that never run it.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
