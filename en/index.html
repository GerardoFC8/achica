<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compress images in bulk, without uploading them | achica</title>
    <meta
      name="description"
      content="Compress many images at once in your browser, without uploading them anywhere. No account, no file limit, free and open source."
    />
    <link rel="canonical" href="https://achica.gfcode.dev/en/" />
    <link rel="alternate" hreflang="es" href="https://achica.gfcode.dev/" />
    <link rel="alternate" hreflang="en" href="https://achica.gfcode.dev/en/" />
    <link rel="alternate" hreflang="x-default" href="https://achica.gfcode.dev/" />
    <meta name="theme-color" content="#f2f1ec" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The English twin of /index.html (D54). Same structure, its own words. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="achica" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="https://achica.gfcode.dev/en/" />
    <meta
      property="og:title"
      content="achica: compress many images at once, without uploading them"
    />
    <meta
      property="og:description"
      content="In your browser, with no account and no file limit. Not a byte of your images leaves your device."
    />
    <meta property="og:image" content="https://achica.gfcode.dev/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="achica, a batch image compressor: three weight bars on light paper"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "achica",
        "url": "https://achica.gfcode.dev/en/",
        "description": "Batch image compressor that runs entirely in the browser. No backend, no account and no file limit.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any with a current browser",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Batch compression with no file limit",
          "JPEG, PNG, WebP and AVIF",
          "Destinations instead of quality numbers: web, email, messaging and thumbnail",
          "A size limit per file: 100 KB, 200 KB or any number",
          "Download as a ZIP or straight into a folder",
          "No image ever leaves the device"
        ]
      }
    </script>
  </head>
  <body>
    <!-- Filled at build time with the first screen, in English (scripts/prerender.mjs). -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
