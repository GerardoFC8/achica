<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove EXIF and metadata from images in bulk, without uploading them | achica</title>
    <meta
      name="description"
      content="Remove EXIF, GPS location, XMP, IPTC, comments and data appended after the image from many JPEG, PNG and WebP files at once, in your browser. No re-encoding: the pixels do not change. Keeps the colour profile and the orientation. No account, free and open source."
    />
    <link rel="canonical" href="https://achica.gfcode.dev/en/remove-exif/" />
    <link rel="alternate" hreflang="es" href="https://achica.gfcode.dev/quitar-exif/" />
    <link rel="alternate" hreflang="en" href="https://achica.gfcode.dev/en/remove-exif/" />
    <link rel="alternate" hreflang="x-default" href="https://achica.gfcode.dev/quitar-exif/" />
    <meta name="theme-color" content="#f2f1ec" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Read by the link previews of WhatsApp, X, LinkedIn and Slack, none of
      which run JavaScript. Absolute URLs because a crawler resolves nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="achica" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="https://achica.gfcode.dev/en/remove-exif/" />
    <meta
      property="og:title"
      content="achica: remove EXIF from many images at once, without uploading them"
    />
    <meta
      property="og:description"
      content="JPEG, PNG and WebP, in your browser and without re-encoding. Not a byte of your images leaves your device."
    />
    <meta property="og:image" content="https://achica.gfcode.dev/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="achica, batch image tools: three weight bars on light paper"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "achica: remove EXIF",
        "url": "https://achica.gfcode.dev/en/remove-exif/",
        "description": "Batch image metadata remover that runs entirely in the browser. No backend and no account.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any with a current browser",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Removes EXIF, GPS location, XMP, IPTC, comments and data appended after the image",
          "No re-encoding: the pixels do not change",
          "JPEG, PNG and WebP; AVIF not yet",
          "Keeps the colour profile and the orientation",
          "Download as a ZIP or straight into a folder",
          "No image ever leaves the device"
        ]
      }
    </script>
  </head>
  <body data-tool="quitar-exif">
    <!--
      Empty in the source. The build fills it with the first screen rendered
      ahead of time (scripts/prerender.mjs), so the page reads the same before
      and after the script runs, and to readers that never run it.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
